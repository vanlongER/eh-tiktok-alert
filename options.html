<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>EH TikTok Báo Trả Hàng</title>
<style>
body{font-family:Barlow,Arial,sans-serif;max-width:560px;margin:24px auto;padding:0 16px;color:#1b1b1b}
h1{font-size:20px} label{display:block;margin:12px 0 4px;font-weight:600}
input[type=text],input[type=password],input[type=number]{width:100%;padding:8px;box-sizing:border-box;border:1px solid #bbb;border-radius:6px}
button{margin:14px 8px 0 0;padding:8px 14px;border:0;border-radius:6px;background:#0a7d5a;color:#fff;cursor:pointer}
button.alt{background:#555} #msg{margin-top:14px;white-space:pre-wrap;color:#0a5} small{color:#666}
</style></head><body>
<h1>EH TikTok Báo Trả Hàng</h1>
<small>Quét trang Quản lý trả hàng của shop EasyHomeVN và báo Telegram. Chỉ đọc, không bấm gì thay mày.</small>
<label>Token bot Telegram</label><input id="token" type="password" autocomplete="off">
<label>Chat ID (nhóm/kênh nhận tin)</label><input id="chatId" type="text">
<label>Thread ID của topic (để trống nếu nhóm không có Topics)</label><input id="threadId" type="text">
<label>Quét mỗi (phút, tối thiểu 5)</label><input id="intervalMin" type="number" min="5" value="10">
<label><input id="heartbeat" type="checkbox" checked> Gửi 1 tin "đang theo dõi OK" mỗi ngày</label>
<div><button id="save">Lưu</button><button id="test" class="alt">Gửi thử Telegram</button><button id="scan" class="alt">Quét ngay</button><button id="reset" class="alt">Xoá bộ nhớ báo trùng</button></div>
<hr style="margin-top:22px"><label>Tự cập nhật extension</label>
<small>Chọn đúng thư mục chứa extension này một lần. Sau đó extension tự tải bản mới từ GitHub và tự tải lại, mày không phải làm gì nữa.</small>
<div><button id="pickdir">Chọn thư mục extension</button><button id="upd" class="alt">Kiểm tra cập nhật ngay</button></div>
<div id="updmsg"></div>
<div id="msg"></div><div id="last"></div>
<script src="updater.js"></script><script src="options.js"></script></body></html>
